# PR definitions come from the trusted base; the job guard rejects fork heads
# before runner admission. Trusted PRs check their exact head SHA.
# GitHub-hosted runners keep this public repository's CI off dappnode.
name: validate
on:
  push:
    branches:
      - main
  schedule:
    - cron: 0 7 * * 1
  workflow_dispatch: null
  pull_request_target:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout with runner git
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        run: |-
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if [[ ! -d .git ]]; then
            git init
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" fetch --force --prune --tags origin "+refs/heads/*:refs/remotes/origin/*" "$CHECKOUT_SHA"
          unset header
          git checkout --force --detach "$CHECKOUT_SHA"
          git clean -ffdx -e 'node_modules/' -e '**/node_modules/'
          git log -1 --oneline
      - name: Profile contract
        run: bash scripts/validate.sh profile
      - name: Link health
        run: bash scripts/validate.sh links
      - name: Linked repository status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/validate.sh repos
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
