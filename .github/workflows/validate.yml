name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The rendered profile depends on live galleonlabs.io, product, and social URLs,
  # and on repositories that can be archived or renamed elsewhere. None of that
  # needs a commit here, so re-check daily and let the drift surface on its own.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Profile contract
        run: bash scripts/validate.sh profile

      - name: Link health
        run: bash scripts/validate.sh links

      - name: Linked repository status
        # The built-in token is read-only on this repository; it is here so the
        # shared runner IP is not rate limited by the public API.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/validate.sh repos
