name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The rendered profile depends on live galleonlabs.io, product, and social URLs,
  # which can break with no commit here. Re-check daily so that drift surfaces on
  # its own rather than waiting for the next edit.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Profile contract
        run: bash scripts/validate.sh profile

      - name: Link health
        run: bash scripts/validate.sh links
