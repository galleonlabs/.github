name: refresh-profile

# Redraws the profile from public records once a day: the ship log and commit
# activity on andrewwilkinson.io, /metrics.json and public GitHub stars.
# scripts/voyage.ts exits non-zero without writing when a source fails or the
# ship log shrinks, so a bad read leaves yesterday's profile in place.
#
# main requires the "validate" check from GitHub Actions, and a commit pushed with
# the workflow token triggers no other workflow. So this job runs that same
# validation on its own commit, records the result as the "validate" check run on
# that commit, and only then fast-forwards main. A failed validation stops
# the job before anything reaches main.
#
# Trusted triggers only: no pull_request event ever gets this write token.

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Redraw
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/voyage.ts

      - name: Commit when the record moved
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- profile/README.md profile/assets; then
            echo "profile unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -- profile/README.md profile/assets
          git commit -m "chore: redraw profile from the ship log"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate (the validate check)
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/validate.sh profile
          bash scripts/validate.sh links
          bash scripts/validate.sh repos

      - name: Record the validate check and fast-forward main
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # The check run needs the commit on GitHub first; park it on a bot branch.
          git push --force origin "HEAD:refs/heads/bot/profile-refresh"
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=validate -f head_sha="$SHA" -f status=completed -f conclusion=success \
            -f "output[title]=Validated by refresh-profile" \
            -f "output[summary]=Run $GITHUB_RUN_ID validated this commit before it reached main." > /dev/null
          git push origin "HEAD:main"
          git push origin --delete bot/profile-refresh
